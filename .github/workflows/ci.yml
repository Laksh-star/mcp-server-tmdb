name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm audit --omit=dev --audit-level=high --prefix docker
      - run: npm run worker:dry-run
      - name: Build stdio container
        if: matrix.node == 22
        run: npm run docker:build
      - name: Worker HTTP/MCP and container fixture workflows
        if: matrix.node == 22
        run: npm run test:http -- --docker
      - name: Worker HTTP/MCP fixture workflows
        if: matrix.node != 22
        run: npm run test:http
